[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deception-analysis-platform"
version = "0.1.0"
description = "Stage 6 Deception Sensor and Analysis Pipeline"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.black]
line-length = 88
target-version = ["py313"]


[tool.mypy]
python_version = "3.13"

strict = false

warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
show_error_codes = true
pretty = true


[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
